name: keep-alive

# Render 무료 서버는 15분 동안 요청이 없으면 잠들고, Supabase 무료 DB는 일주일쯤 쓰지 않으면 일시정지된다.
# /api/health 가 DB에 쿼리까지 보내므로, 이 요청 하나로 둘 다 막는다.
# 한국 시간 06:00~23:59 에만 10분마다 호출한다 (Render 무료 월 750시간 안에 들어가도록).
on:
  schedule:
    - cron: "*/10 21-23,0-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            https://pycoach-backend.onrender.com/api/health
